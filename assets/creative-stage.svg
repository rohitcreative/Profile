<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
<title id="t">Rohit Yadav — 3D visual playground</title><desc id="d">Animated neon wireframe, floating geometric forms, a camera rig and a stylized viewport representing 3D animation, CGI and VFX.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101729"/><stop offset="1" stop-color="#211a45"/></linearGradient><linearGradient id="mint"><stop stop-color="#72f2c3"/><stop offset="1" stop-color="#c9ff8e"/></linearGradient><linearGradient id="pink"><stop stop-color="#ff729f"/><stop offset="1" stop-color="#ffcf90"/></linearGradient><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#a7b6df" stroke-opacity=".12"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
