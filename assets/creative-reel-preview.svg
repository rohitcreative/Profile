<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
<title id="title">Creative Motion Lab</title>
<desc id="desc">Six equally sized floating point-top hexagons arranged around a rotating green-to-yellow cube. Orange line-art icons represent animation, CGI product visuals, 3D environment, lighting and rendering, graphic design, and short film.</desc>
<defs>
 <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05070b"/><stop offset="1" stop-color="#0a0d13"/></linearGradient>
 <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#70e67b"/><stop offset="1" stop-color="#c5dc32"/></linearGradient>
 <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ff792d"/><stop offset="1" stop-color="#ff4e20"/></linearGradient>
 <pattern id="mesh" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M0 0L64 64M64 0L0 64" stroke="#8793a6" stroke-opacity=".11" stroke-width="1"/></pattern>
 <path id="hex" d="M0-100 86.6-50 86.6 50 0 100-86.6 50-86.6-50Z"/>
 <style>
  .hex{fill:#17181c;stroke:#ffffff;stroke-opacity:.14;stroke-width:1.2}
  .label{font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:800;fill:#f7f7f8;text-anchor:middle}
  .icon{fill:none;stroke:url(#orange);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes cubeSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  .cube-spin{transform-box:fill-box;transform-origin:center;animation:cubeSpin 10s linear infinite}
  @media(prefers-reduced-motion:reduce){.float-inner,.cube-spin{animation:none!important}}
 </style>
</defs>
<rect width="900" height="900" rx="24" fill="url(#background)"/>
<rect width="900" height="900" rx="24" fill="url(#mesh)"/>
<g fill="none" stroke="#778397" stroke-opacity=".17" stroke-width="1.8">
 <path d="M-100 120C120-50 270 210 460 110S730-30 1000 130M-100 190C120 20 270 280 460 180S730 40 1000 200M-100 260C120 90 270 350 460 250S730 110 1000 270M-100 330C120 160 270 420 460 320S730 180 1000 340M-100 400C120 230 270 490 460 390S730 250 1000 410"/>
 <path d="M100-40L-40 940M210-40L70 940M320-40L180 940M430-40L290 940M540-40L400 940M650-40L510 940M760-40L620 940M870-40L730 940" stroke-opacity=".09"/>
</g>
<!-- 1. Animation: upper-left -->
<g transform="translate(335 251)">
 <g class="float-inner">
  <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 -6;0 0" dur="4.5s" begin="-.4s" repeatCount="indefinite"/>
  <use href="#hex" fill="url(#lime)"/>
  <g class="icon" transform="translate(0 -20) scale(.64)"><circle cx="0" cy="-29" r="7"/><circle cx="-8" cy="-5" r="6"/><path d="M-2-21L-6-12M-14-4L-30 10M-2 2L13 17M-5 4L-14 29M2-9L24-18M-14 29L-30 38M13 17L7 36M-30 38L-38 42M7 36L18 40M-14-11L-25-20M4-12L17-23"/></g>
  <text class="label" x="0" y="37" style="fill:#07100a">ANIMATION</text>
 </g>
</g>
<!-- 2. CGI product visual: upper-right -->
<g transform="translate(565 251)">
 <g class="float-inner">
  <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 -6;0 0" dur="4.5s" begin="-1.1s" repeatCount="indefinite"/>
  <use href="#hex" class="hex"/>
  <g class="icon" transform="translate(0 -24) scale(.61)"><circle cy="-34" r="6"/><path d="M-2-27L-14-8L-10 9L-17 28L-11 40M2-27L14-8L10 9L17 28L11 40M-14-8H14M-10 9H10M-17 28H17M-11 40L-20 46M11 40L20 46"/></g>
  <text class="label" x="0" y="29"><tspan x="0">CGI PRODUCT</tspan><tspan x="0" dy="18">VISUAL</tspan></text>
 </g>
</g>
<!-- 3. 3D environment: right -->
<g transform="translate(680 450)">
 <g class="float-inner">
  <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 -6;0 0" dur="4.5s" begin="-2s" repeatCount="indefinite"/>
  <use href="#hex" class="hex"/>
  <g class="icon" transform="translate(0 -23) scale(.62)"><path d="M-36-38V38M-24-38V38M24-38V38M36-38V38M-36-22H-24M-36-4H-24M-36 14H-24M24-22H36M24-4H36M24 14H36"/><path d="M-19 23Q-7-4 0 12T19 23L13 38H-13Z"/><path d="M-9-22L-4-15L-9-8M9-22L4-15L9-8M-16-12H-10M16-12H10"/></g>
  <text class="label" x="0" y="37"><tspan x="0">3D ENVIRONMENT</tspan></text>
 </g>
</g>
<!-- 4. Lighting and rendering: lower-right -->
<g transform="translate(565 649)">
 <g class="float-inner">
  <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 -6;0 0" dur="4.5s" begin="-2.8s" repeatCount="indefinite"/>
  <use href="#hex" class="hex"/>
  <g class="icon" transform="translate(0 -23) scale(.62)"><path d="M-38-28H-27M-38-28V-17M38-28H27M38-28V-17M-38 28H-27M-38 28V17M38 28H27M38 28V17"/><path d="M-9 25Q-28 7-7-8Q-12 9 3 8Q16 7 8-7Q29 10 13 25Z" fill="#ff702b" fill-opacity=".15"/><path d="M-8 33H19M-4-15L-1-21M8-16L12-21"/></g>
  <text class="label" x="0" y="29"><tspan x="0">LIGHTING &amp;</tspan><tspan x="0" dy="18">RENDERING</tspan></text>
 </g>
</g>
<!-- 5. Graphic design: lower-left -->
<g transform="translate(335 649)">
 <g class="float-inner">
  <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 -6;0 0" dur="4.5s" begin="-3.5s" repeatCount="indefinite"/>
  <use href="#hex" class="hex"/>
  <g class="icon" transform="translate(0 -23) scale(.62)"><path d="M-37 19A37 37 0 0 1 37 19M0-22V24M-25 0L-5 24M25 0L5 24M-37 19H-27V30H-37ZM27 19H37V30H27ZM-8 24H8L13 38H-13Z"/><circle cy="6" r="8"/></g>
  <text class="label" x="0" y="37">GRAPHIC DESIGN</text>
 </g>
</g>
<!-- 6. Short film: left -->
<g transform="translate(220 450)">
 <g class="float-inner">
  <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 -6;0 0" dur="4.5s" begin="-1.7s" repeatCount="indefinite"/>
  <use href="#hex" class="hex"/>
  <g class="icon" transform="translate(0 -23) scale(.62)"><path d="M-38-25H38V-8H-38Z M-38-8Q-29-8-29 0T-38 8V23H38V8Q29 8 29 0T38-8"/><path d="M-25-20V-14M-12-20V-14M1-20V-14M14-20V-14M27-20V-14"/><rect x="-28" y="30" width="25" height="20" rx="2"/><path d="M-3 33L12 28V51L-3 46M20 31H39M20 41H44M20 50H36"/></g>
  <text class="label" x="0" y="37">SHORT FILM</text>
 </g>
</g>
<!-- Center cube: three visible faces of a 3D cube, continuously rotating -->
<g transform="translate(450 450)">
 <g class="cube-spin">
  <polygon points="0,-35 31,-17 0,1 -31,-17" fill="#b6e64a" stroke="#e2ffad" stroke-opacity=".65" stroke-width="1.4"/>
  <polygon points="-31,-17 0,1 0,36 -31,18" fill="#70e67b" stroke="#e2ffad" stroke-opacity=".65" stroke-width="1.4"/>
  <polygon points="0,1 31,-17 31,18 0,36" fill="#c5dc32" stroke="#e2ffad" stroke-opacity=".65" stroke-width="1.4"/>
 </g>
 <circle r="3.5" fill="#e0ed58"/>
</g>
</svg>